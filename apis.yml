aid: bitcoinyield
name: BitcoinYield
image: https://bitcoinyield.co/opengraph-image?v=165863
description: BitcoinYield provides live cryptocurrency yield data across approximately 220 platforms, covering assets such as BTC, ETH, SOL, and
  various stablecoins. The service ranks yields by risk grade (A‑D) and presents them without requiring API keys, authentication, or sign‑up.
  Updated every three hours, the API offers endpoints for current yields, methodology details, and a Managed Connectivity Platform (MCP) for bulk
  data access. The platform aims to give developers transparent, real‑time yield information for integration into financial applications.
