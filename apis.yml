image: https://bitcoinyield.co/opengraph-image?v=165863
description: BitcoinYield publishes live crypto yields (BTC, ETH, SOL and stablecoins) from about 220 platforms, each with an A-D risk grade,
  refreshed every three hours. The REST API (GET /api/v1/yields, /api/v1/offers, /api/v1/prices) and a remote Model Context Protocol (MCP) server
  for AI agents (https://bitcoinyield.co/api/mcp, tools list_yields and list_offers) need no key, account or sign-up.
